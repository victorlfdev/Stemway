name: Release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
env:
  NODE_VERSION: '18'
  RUST_VERSION: '1.77.2'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build
        run: echo "Building..."
