name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  NODE_VERSION: '18'
  RUST_VERSION: '1.77.2'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libgtk-3-dev \
            webkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            pkg-config \
            libdbus-1-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Linux
        run: npm run tauri build -- --target x86_64-unknown-linux-gnu

      - name: Upload Linux bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust
        run: rustup update stable && rustup default stable && rustup target add x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Upload Windows bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux bundles
        uses: actions/download-artifact@v4
        with:
          name: linux-bundles

      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: windows-bundle

      - name: Generate changelog
        id: changelog
        run: |
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$(git log $(git describe --tags --abbrev=0 HEAD~1)..HEAD --pretty=format:'* %s (%h)' 2>/dev/null || echo '- Initial release')" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bundle/deb/*.deb
            bundle/rpm/*.rpm
            bundle/msi/*.msi
          body: ${{ steps.changelog.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
