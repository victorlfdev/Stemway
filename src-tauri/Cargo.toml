[package]
name = "stemway"
version = "0.3.0"
description = "Stemway — Local AI audio separation"
authors = ["Victor"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
directories = "5"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
base64 = "0.22"
tokio = { version = "1", features = ["process", "io-util", "sync"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "stream"] }
zip = "2"
tar = "0.4"
xz2 = "0.1"
flate2 = "1.0"

[features]
default = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
